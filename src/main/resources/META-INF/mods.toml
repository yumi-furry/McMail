# McMail mods.toml - server-only mail configuration bridge mod.
# Standard TOML format, v0.5.0: https://github.com/toml-lang/toml

# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory
# A version range to match for said mod loader - for regular FML @Mod it will be the forge version
loaderVersion="${loader_version_range}" #mandatory
# The license for this mod.
license="${mod_license}"

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory
# The modid of the mod
modId="${mod_id}" #mandatory
# The version number of the mod
version="${mod_version}" #mandatory
# A display name for the mod
displayName="${mod_name}" #mandatory
# A text field displayed in the mod UI
authors="${mod_authors}" #optional
# McMail is a dedicated-server-only mod. IGNORE_ALL_VERSION makes the client ignore
# this mod completely (no red X, no required copy on the client).
# NOTE: there is intentionally no "serverSideOnly" field in Forge 1.20.1.
displayTest="IGNORE_ALL_VERSION"
# The description text for the mod (multi line!)
description='''${mod_description}'''

# Forge dependency - only needed on the server side
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="SERVER"

# Minecraft dependency - only needed on the server side
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="SERVER"
