<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>McMail 测试邮件</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f5f9;">
  <!-- 邮件客户端兼容性：table 布局 + 全内联样式，不使用 class/flex/grid -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f5f9;">
    <tr>
      <td align="center" style="padding:40px 16px;">

        <!-- 顶部 Logo -->
        <table role="presentation" cellpadding="0" cellspacing="0">
          <tr>
            <td align="center" style="padding-bottom:28px;">
              <img src="cid:mcmail-logo" width="200" alt="Mc-Mail"
                   style="display:block;border:0;width:200px;height:auto;image-rendering:pixelated;">
            </td>
          </tr>
        </table>

        <!-- 主卡片 -->
        <table role="presentation" width="560" cellpadding="0" cellspacing="0"
               style="width:560px;max-width:100%;background-color:#ffffff;border-radius:12px;box-shadow:0 2px 8px rgba(15,23,42,0.06);">

          <tr>
            <td style="padding:36px 40px 0 40px;font-family:'Segoe UI','Microsoft YaHei',Arial,sans-serif;">
              <h1 style="margin:0;font-size:22px;line-height:1.3;color:#0f172a;font-weight:700;">McMail 测试邮件</h1>
            </td>
          </tr>

          <tr>
            <td style="padding:16px 40px 0 40px;font-family:'Segoe UI','Microsoft YaHei',Arial,sans-serif;font-size:14px;line-height:1.8;color:#475569;">
              这是一封来自 McMail 的测试邮件。收到此邮件说明你的 SMTP 配置工作正常，服务器已可以正常对外发信。
            </td>
          </tr>

          <!-- 高亮信息框 -->
          <tr>
            <td style="padding:26px 40px 0 40px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                     style="background-color:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;">
                <tr>
                  <td align="center" style="padding:20px 12px;font-family:'Segoe UI','Microsoft YaHei',Arial,sans-serif;">
                    <div style="font-size:12px;color:#3b82f6;letter-spacing:4px;">发送时间</div>
                    <div style="font-size:22px;color:#0f172a;font-weight:600;margin-top:8px;">{{SERVER_TIME}}</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- 按钮 -->
          <tr>
            <td style="padding:30px 40px 0 40px;">
              <a href="https://github.com/yumi-furry/McMail"
                 style="display:inline-block;background-color:#0f172a;color:#ffffff;font-family:'Segoe UI','Microsoft YaHei',Arial,sans-serif;font-size:13px;font-weight:600;text-decoration:none;padding:12px 24px;border-radius:999px;">访问 GitHub 仓库</a>
            </td>
          </tr>

          <!-- 分隔线 -->
          <tr>
            <td style="padding:30px 40px 0 40px;">
              <hr style="border:none;border-top:1px solid #e2e8f0;margin:0;">
            </td>
          </tr>

          <!-- 页脚 -->
          <tr>
            <td style="padding:18px 40px 34px 40px;font-family:'Segoe UI','Microsoft YaHei',Arial,sans-serif;font-size:12px;line-height:2;color:#94a3b8;">
              本邮件由 McMail Mod 自动发送，请勿直接回复。<br>
              GitHub：<a href="https://github.com/yumi-furry/McMail" style="color:#64748b;text-decoration:none;">github.com/yumi-furry/McMail</a><br>
              联系作者：<a href="mailto:3783260249@qq.com" style="color:#64748b;text-decoration:none;">3783260249@qq.com</a><br>
              &copy; 2026 McMail
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
